# nginx vhost for the staging dashboard on 185.2.103.152.
# Same shape as app.banooridairy.pk.conf, pointed at the staging container.
#
#   sudo ln -s /etc/nginx/sites-available/stg.banooridairy.pk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stg.banooridairy.pk
#
# Do not hand-write the ssl_certificate lines — certbot rewrites this file and
# adds them, plus the :80 -> :443 redirect.

server {
    listen 80;
    server_name stg.banooridairy.pk;

    # Matches production: uploads are capped at 10MB in the route handlers, so
    # leave headroom and let the app return its own error instead of a bare 413.
    client_max_body_size 25M;

    location / {
        # Staging container publishes on 127.0.0.1:3006 only. Production is 3004.
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;

        # Staging serves the same content as production off the same database.
        # Without this, search engines index both and the duplicate outranks the
        # real one.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
