# nginx vhost for the dashboard on 185.2.103.152.
# Copy to /etc/nginx/sites-available/app.banooridairy.pk and symlink into
# sites-enabled, then let certbot add the TLS block (same as the other apps on
# this box — see /etc/nginx/sites-enabled/helpora-app).
#
#   sudo ln -s /etc/nginx/sites-available/app.banooridairy.pk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.banooridairy.pk
#
# Do not hand-write the ssl_certificate lines — certbot rewrites this file and
# adds them, plus the :80 -> :443 redirect.

server {
    listen 80;
    server_name app.banooridairy.pk;

    # Receipt and expense-chit uploads are capped at 10MB in the route handlers;
    # leave headroom so nginx returns the app's error, not a bare 413.
    client_max_body_size 25M;

    location / {
        # The container publishes on 127.0.0.1:3004 only — never 0.0.0.0, so the
        # app is not reachable except through this vhost.
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
